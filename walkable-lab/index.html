<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="lab.png"><title>Adam’s Laboratory · Godot preview</title>
<style>*{box-sizing:border-box}body{margin:0;background:#111a1d;color:#e6eceb;font:14px system-ui}header{height:54px;display:flex;align-items:center;gap:20px;padding:0 22px;border-bottom:1px solid #384447}header strong{color:#a2dfcb}header span{color:#a7b6ba}button{border:1px solid #5b737a;border-radius:4px;background:#26383c;color:#e5eeed;padding:8px 16px;cursor:pointer}#game{width:100%;height:calc(100vh - 54px);border:0}dialog{width:96vw;height:94vh;max-width:none;max-height:none;border:1px solid #657c80;padding:0;background:#121a1e;color:white}dialog::backdrop{background:#0009}dialog header{justify-content:space-between}#chemistry{width:100%;height:calc(100% - 54px);border:0}.right{margin-left:auto}</style>
<header><strong>ADAM’S LABORATORY</strong><span>Godot · Upper floor + apartment · Browser preview</span><button class="right" id="tools">Chemical workspaces</button></header>
<iframe id="game" src="lab.html" allow="autoplay; fullscreen" title="Walkable laboratory"></iframe>
<div id="loading" style="position:fixed;inset:54px 0 0;background:#111a1d;display:grid;place-content:center;text-align:center;pointer-events:none"><h2>Preparing the laboratory</h2><p style="color:#a7b6ba">The first visit compiles Godot’s graphics shaders.<br>Please allow about 40 seconds on your first visit.</p></div>
<dialog id="station"><header><strong id="stationTitle">Chemical workspace</strong><button id="back">Return to the room</button></header><iframe id="chemistry" title="Chemical workspace"></iframe></dialog>
<script>
const game=document.querySelector('#game'),dialog=document.querySelector('#station'),chem=document.querySelector('#chemistry');let loaded=false,pending='calculation';
function selectWorkspace(){const doc=chem.contentDocument;if(!doc)return;const buttons=[...doc.querySelectorAll('.workspace-nav button')];const label=pending==='electrochemistry'?'KF titration':pending==='calculation'?'Calculation':'Wet Lab';if(label==='KF titration'){let select=doc.querySelector('[aria-label="Laboratory area"]');if(select&&select.value!=='electrochemistry'){Object.getOwnPropertyDescriptor(HTMLSelectElement.prototype,'value').set.call(select,'electrochemistry');select.dispatchEvent(new Event('change',{bubbles:true}));}}else{let select=doc.querySelector('[aria-label="Laboratory area"]');if(select&&select.value!=='equilibrium'){select.value='equilibrium';select.dispatchEvent(new Event('change',{bubbles:true}));}buttons.find(b=>b.textContent.trim()===label)?.click();}if(pending==='redox')setTimeout(()=>[...doc.querySelectorAll('button')].find(b=>b.textContent.trim()==='Redox Titration')?.click(),150);}
function openStation(name){pending=name;document.querySelector('#stationTitle').textContent=name==='electrochemistry'?'Electrochemistry':name==='calculation'?'Chemical equilibrium':'Wet Lab';dialog.showModal();if(!loaded){chem.src='/adambritts-site/laboratory/';loaded=true;}else selectWorkspace();}
chem.addEventListener('load',()=>{const observer=new MutationObserver(()=>{if(chem.contentDocument.querySelector('.workspace-nav')){observer.disconnect();selectWorkspace();}});observer.observe(chem.contentDocument,{subtree:true,childList:true});selectWorkspace();});
window.addEventListener('message',e=>{if(e.source!==game.contentWindow)return;if(e.data.type==='lab-ready')document.querySelector('#loading')?.remove();if(e.data.type==='lab-station')openStation(e.data.station);});
document.querySelector('#tools').onclick=()=>openStation('calculation');
function closeStation(){dialog.close();game.contentWindow.godotCommand?.('resume');game.focus();}
document.querySelector('#back').onclick=closeStation;dialog.addEventListener('cancel',e=>{e.preventDefault();closeStation();});
</script></html>
